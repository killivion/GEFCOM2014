name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python 3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MPLBACKEND: Agg
        # Each failing test is also emitted as an ::error annotation, so it
        # shows up on the run page without opening the log.
        run: |
          set +e
          python -m pytest -q -rfE --tb=line tests/ 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | sed 's/^/::error::/'
          grep -E "^/.*:[0-9]+: " pytest.log | head -20 | sed 's/^/::error::/'
          exit $status

  docker:
    name: Docker build + tests in image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gefcom2014:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image ls gefcom2014:ci

      - name: Run tests inside the image
        run: docker run --rm gefcom2014:ci
